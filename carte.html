<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Carte — AI Map Storyteller</title>

  <!-- PWA -->
  <meta name="theme-color" content="#f59e0b" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Carte" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />

  <!-- Mapbox GL JS -->
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css" rel="stylesheet" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js"></script>

  <!-- Firebase JS SDK (modular CDN, no bundler needed) -->
  <script type="module">
    import { initializeApp }                        from 'https://www.gstatic.com/firebasejs/11.5.0/firebase-app.js';
    import { getFirestore, collection, doc,
             getDocs, setDoc, deleteDoc,
             query, where, orderBy }                from 'https://www.gstatic.com/firebasejs/11.5.0/firebase-firestore.js';
    window.__firebaseModules = { initializeApp, getFirestore, collection, doc,
                                 getDocs, setDoc, deleteDoc, query, where, orderBy };
  </script>

  <link rel="stylesheet" href="carte.css" />
</head>
<body>

<div id="lightbox">
  <button id="lightbox-close" title="Close">✕</button>
  <img id="lightbox-img" src="" alt="Photo" />
</div>

<div id="map"></div>

<div id="fly-label"></div>

<!-- Saved trips sidebar — right edge of the map -->
<div id="trips-sidebar">
  <div id="trips-sidebar-header">
    <span>My Trips</span>
    <button id="new-trip-btn" title="Start a new trip">＋</button>
  </div>
  <div id="trips-list"><!-- tiles injected by JS --></div>
</div>

<!-- Name-trip dialog (inline, no modal library) -->
<div id="name-trip-dialog">
  <div id="name-trip-box">
    <label for="trip-name-input">Name this trip</label>
    <input id="trip-name-input" type="text" placeholder="e.g. Euro Summer 2025"
           maxlength="60" autocomplete="off" />
    <div id="name-trip-actions">
      <button id="name-trip-cancel">Cancel</button>
      <button id="name-trip-save">Save</button>
    </div>
  </div>
</div>

<!-- Username prompt — shown on first visit if no ?u= in URL -->
<div id="username-dialog">
  <div id="username-box">
    <div id="username-logo">Travel<em>Log</em></div>
    <p id="username-tagline">Your travel log visualizer</p>
    <label for="username-input">Choose a username to sync your trips across devices</label>
    <input id="username-input" type="text" placeholder="e.g. shabnam"
           maxlength="30" autocomplete="username" spellcheck="false" />
    <p id="username-hint">Letters, numbers and hyphens only. This becomes part of your URL.</p>
    <button id="username-go">Start exploring →</button>
  </div>
</div>

<!-- Brand bar — outside #panel so it can be position:fixed on mobile
     without being clipped by the panel's backdrop-filter stacking context -->
<div id="panel-header">
  <h1>Car<em>te</em></h1>

  <div id="user-badge" title="Your personal URL — share it to sync across devices" style="display:none">
    <span id="user-badge-icon">👤</span>

</div>

  </div>

<script>
// ─────────────────────────────────────────
// CONFIG
// ─────────────────────────────────────────
const MAPBOX_TOKEN       = '__MAPBOX_TOKEN__';
const FIREBASE_API_KEY   = '__FIREBASE_API_KEY__';
const FIREBASE_PROJECT   = '__FIREBASE_PROJECT__';
const FIREBASE_APP_ID    = '__FIREBASE_APP_ID__';
const ANTHROPIC_PROXY = window.location.hostname === 'localhost'
  ? 'http://localhost:3000/api/claude'
  : '/api/claude';

/** Default starting coordinate (New York City) — declared first, used everywhere */
const ORIGIN = [-74.006, 40.7128];

/** Animation durations (ms) */
const DURATIONS = {
  fly:         4000,  // live fly_to_location animation
  flyReplay:   3800,  // replay segment animation
  flyOverview: 2000,  // replay fly-back-to-origin
  overviewWait: 2200, // sleep after fly-back before replay starts
};

/** Fallback route line colour (plane / no transport selected) */
const DEFAULT_LINE_COLOR = '#7B3F00';

/** Claude model + token caps */
const CLAUDE_MODEL      = 'claude-sonnet-4-20250514';
const CLAUDE_MAX_TOKENS = 1000;
const CLAUDE_MAX_TOKENS_GREETING = 120;

// ─────────────────────────────────────────
// MAPBOX INIT
// ─────────────────────────────────────────
mapboxgl.accessToken = MAPBOX_TOKEN;

const map = new mapboxgl.Map({
  container: 'map',
  style: 'mapbox://styles/mapbox/outdoors-v12',
  center: ORIGIN,
  zoom: 10,
  pitch: 40,
  bearing: 0,
  projection: 'globe',
});

map.on('load', () => {
  map.setFog({
    color: 'rgb(186, 210, 235)',
    'high-color': 'rgb(36, 92, 223)',
    'horizon-blend': 0.02,
    'space-color': 'rgb(11, 11, 25)',
    'star-intensity': 0.6
  });

  // ── TRAVEL PATH LINE ──────────────────────
  map.addSource('route', {
    type: 'geojson',
    data: { type: 'Feature', geometry: { type: 'LineString', coordinates: [ORIGIN] } }
  });

  map.addLayer({
    id: 'route-line',
    type: 'line',
    source: 'route',
    layout: { 'line-join': 'round', 'line-cap': 'round' },
    paint: {
      'line-color': DEFAULT_LINE_COLOR,
      'line-width': 4,
      'line-opacity': 1,
    }
  });

  map.addLayer({
    id: 'route-line-dash',
    type: 'line',
    source: 'route',
    layout: { 'line-join': 'round', 'line-cap': 'round' },
    paint: {
      'line-color': '#ffffff',
      'line-width': 2,
      'line-opacity': 0.7,
      'line-dasharray': [4, 6],
    }
  });
});

// ─────────────────────────────────────────
// APP STATE
// ─────────────────────────────────────────

let currentMarker = null;
// Travel path coordinates (starts at NYC)
const routeCoords = [ORIGIN.slice()];
// Ordered log of every visited stop (for replay).
// Each entry: { coords, display_name, description, zoom,
//               transport, transportDef, lineColor }
const tripLog = [];

// Transport state — selected before each new destination
const TRANSPORT = {
  plane:  { emoji: '✈️', label: 'by plane', lineColor: DEFAULT_LINE_COLOR },
  train:  { emoji: '🚂', label: 'by train', lineColor: '#1a6faf' },
  car:    { emoji: '🚗', label: 'by car',   lineColor: '#2e7d32' },
  custom: { emoji: '🚲', label: 'by bike',  lineColor: '#6a3d9a' }, // overwritten at runtime
};
let currentTransport = null; // null = not yet picked for this leg

// ─────────────────────────────────────────
// SHARED UTILITIES
// ─────────────────────────────────────────

/** Ease-in-out cubic — matches Mapbox flyTo easing */
const easeInOutCubic = t => t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;

/** Linear interpolation */
const lerp = (a, b, t) => a + (b - a) * t;

/**
 * Shared flyTo options factory.
 * @param {[number,number]} center
 * @param {number} zoom
 * @param {number} duration
 */
function makeFlyOptions(center, zoom, duration) {
  return {
    center,
    zoom,
    pitch:    zoom > 10 ? 55 : 35,
    bearing:  Math.random() * 40 - 20,
    duration,
    essential: true,
    curve:    1.6,
    easing:   easeInOutCubic,
  };
}

// ─────────────────────────────────────────
// DOM REFS  — all getElementById calls in one place
// ─────────────────────────────────────────

// Lightbox
const lightbox         = document.getElementById('lightbox');
const lightboxImg      = document.getElementById('lightbox-img');
const lightboxCloseBtn = document.getElementById('lightbox-close');

// Chat panel
const log        = document.getElementById('log');
const welcomeMsg = document.getElementById('welcome-msg');
const sendBtn    = document.getElementById('send-btn');
const inputEl    = document.getElementById('location-input');
const flyLabel   = document.getElementById('fly-label');
const replayBar  = document.getElementById('replay-bar');

// Replay HUD
const hudEl        = document.getElementById('replay-hud');
const hudStopLabel = document.getElementById('hud-stop-label');
const hudNameLabel = document.getElementById('hud-name-label');
const hudTransport = document.getElementById('hud-transport-label');
const hudDotsEl    = document.getElementById('hud-dots');
const hudNextBtn   = document.getElementById('hud-next-btn');
const replayBtn    = document.getElementById('replay-btn');
const stopBtn      = document.getElementById('stop-btn');
const saveTripBtn  = document.getElementById('save-trip-btn');

// Trips sidebar
const tripsList       = document.getElementById('trips-list');
const newTripBtn      = document.getElementById('new-trip-btn');
const nameTripDialog  = document.getElementById('name-trip-dialog');
const tripNameInput   = document.getElementById('trip-name-input');
const nameTripCancel  = document.getElementById('name-trip-cancel');
const nameTripSaveBtn = document.getElementById('name-trip-save');

// Username / user badge
const userBadge      = document.getElementById('user-badge');
const userBadgeName  = document.getElementById('user-badge-name');
const userBadgeCopy  = document.getElementById('user-badge-copy');
const usernameDialog = document.getElementById('username-dialog');
const usernameInput  = document.getElementById('username-input');
const usernameGo     = document.getElementById('username-go');

// ─────────────────────────────────────────
// USERNAME & FIREBASE INIT
// ─────────────────────────────────────────

/**
 * Current username — read from ?u= query param.
 * null means not yet set (username dialog will show).
 */
let currentUser = new URLSearchParams(location.search).get('u')?.trim().toLowerCase() || null;

/** Sanitise: letters, numbers, hyphens only, max 30 chars */
const sanitiseUser = s => s.trim().toLowerCase().replace(/[^a-z0-9-]/g, '').slice(0, 30);

/**
 * Firestore db instance — null until Firebase modules load.
 * Populated asynchronously; guarded by useFirebase() before every call.
 */
let _db = null;

// Wait for the Firebase module <script type="module"> to expose its exports,
// then initialise Firestore if all three env vars are present.
function _initFirebase() {
  const m = window.__firebaseModules;
  if (!m) return;
  if (!FIREBASE_API_KEY || FIREBASE_API_KEY.startsWith('__')) return;
  try {
    const app = m.initializeApp({
      apiKey:    FIREBASE_API_KEY,
      projectId: FIREBASE_PROJECT,
      appId:     FIREBASE_APP_ID,
    });
    _db = m.getFirestore(app);
  } catch (e) {
    console.warn('Firebase init error:', e.message);
  }
}

// The module script runs asynchronously; poll briefly then give up.
(function waitForFirebase(attempts) {
  if (window.__firebaseModules) { _initFirebase(); return; }
  if (attempts > 0) setTimeout(() => waitForFirebase(attempts - 1), 120);
})(25);

/** Set the username: update URL, badge, and re-render sidebar */
function applyUsername(name) {
  currentUser = sanitiseUser(name);
  // Update URL without reload
  const url = new URL(location.href);
  url.searchParams.set('u', currentUser);
  history.replaceState({}, '', url.toString());
  // Show badge
  userBadgeName.textContent = currentUser;
  userBadge.style.display = 'flex';
  usernameDialog.classList.remove('open');
  refreshSidebar();
}

// Show username dialog if no ?u= in URL
if (!currentUser) {
  usernameDialog.classList.add('open');
  setTimeout(() => usernameInput.focus(), 80);
} else {
  userBadgeName.textContent = currentUser;
  userBadge.style.display = 'flex';
}

function handleUsernameGo() {
  const val = sanitiseUser(usernameInput.value);
  if (!val) { usernameInput.focus(); return; }
  applyUsername(val);
}
usernameGo.addEventListener('click', handleUsernameGo);
usernameInput.addEventListener('keydown', e => { if (e.key === 'Enter') handleUsernameGo(); });

// Copy personal URL to clipboard
userBadgeCopy.addEventListener('click', () => {
  const url = new URL(location.href);
  url.searchParams.set('u', currentUser);
  navigator.clipboard.writeText(url.toString()).then(() => {
    userBadgeCopy.textContent = '✓';
    setTimeout(() => { userBadgeCopy.textContent = '⎘'; }, 1800);
  });
});

// ─────────────────────────────────────────
// #region STORAGE LAYER
// Primary: Firebase Firestore (cross-device sync, keyed by user_id = username)
// Fallback: IndexedDB (offline / Firebase not configured)
// ─────────────────────────────────────────
const DB_NAME    = 'carte-db';
const DB_VERSION = 1;
const IDB_STORE  = 'trips';

// ── IndexedDB helpers ─────────────────────

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(IDB_STORE)) {
        const store = db.createObjectStore(IDB_STORE, { keyPath: 'id' });
        store.createIndex('updatedAt', 'updatedAt', { unique: false });
      }
    };
    req.onsuccess = e => resolve(e.target.result);
    req.onerror   = e => reject(e.target.error);
  });
}

function idbReq(req) {
  return new Promise((resolve, reject) => {
    req.onsuccess = e => resolve(e.target.result);
    req.onerror   = e => reject(e.target.error);
  });
}

async function idbPut(record) {
  const db = await openDB();
  await idbReq(db.transaction(IDB_STORE, 'readwrite').objectStore(IDB_STORE).put(record));
}

async function idbGetAll() {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const req = db.transaction(IDB_STORE, 'readonly').objectStore(IDB_STORE).getAll();
    req.onsuccess = e => resolve(e.target.result);
    req.onerror   = e => reject(e.target.error);
  });
}

async function idbDelete(id) {
  const db = await openDB();
  await idbReq(db.transaction(IDB_STORE, 'readwrite').objectStore(IDB_STORE).delete(id));
}

// ── Shared helpers ────────────────────────

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function serialiseStops() {
  return tripLog.map(stop => ({
    coords:       stop.coords,
    display_name: stop.display_name,
    description:  stop.description,
    zoom:         stop.zoom,
    transport:    stop.transport,
    transportDef: stop.transportDef,
    lineColor:    stop.lineColor,
    photos:       stop.fan ? stop.fan.photos.map(p => p.dataUrl) : [],
  }));
}

// ── Firebase Firestore helpers ────────────

/** True when Firestore is ready AND a username is set */
const useFirebase = () => _db !== null && !!currentUser;

/**
 * Write / overwrite a trip document in Firestore.
 * Collection: trips  — document ID = record.id
 * Fields: user_id, name, stops_json, thumb, created_at, updated_at
 */
async function fbUpsert(record) {
  if (!useFirebase()) return;
  const { doc, setDoc } = window.__firebaseModules;
  try {
    await setDoc(doc(_db, 'trips', record.id), {
      user_id:    currentUser,
      name:       record.name,
      stops_json: JSON.stringify(record.stops),
      thumb:      record.thumb ?? null,
      created_at: record.createdAt,
      updated_at: record.updatedAt,
    });
  } catch (e) {
    console.warn('Firestore upsert error:', e.message);
  }
}

/**
 * Fetch all trips for currentUser, ordered newest-first.
 * Returns an array of app-format records, or null on failure.
 */
async function fbLoadAll() {
  if (!useFirebase()) return null;
  const { collection, query, where, orderBy, getDocs } = window.__firebaseModules;
  try {
    const q   = query(
      collection(_db, 'trips'),
      where('user_id', '==', currentUser),
      orderBy('updated_at', 'desc')
    );
    const snap = await getDocs(q);
    return snap.docs.map(d => {
      const r = d.data();
      return {
        id:        d.id,
        name:      r.name,
        stops:     JSON.parse(r.stops_json),
        thumb:     r.thumb,
        createdAt: r.created_at,
        updatedAt: r.updated_at,
      };
    });
  } catch (e) {
    console.warn('Firestore fetch error:', e.message);
    return null;
  }
}

/** Delete one trip document from Firestore. */
async function fbDelete(id) {
  if (!useFirebase()) return;
  const { doc, deleteDoc } = window.__firebaseModules;
  try {
    await deleteDoc(doc(_db, 'trips', id));
  } catch (e) {
    console.warn('Firestore delete error:', e.message);
  }
}

// ── Unified API (used everywhere in the app) ──────────────

/**
 * In-memory trip cache — the single source of truth for the sidebar UI.
 * All mutations update this map immediately so refreshSidebar() never has
 * to wait for a Firestore or IDB round-trip to see the latest state.
 */
const _tripCache = new Map(); // id → record

function _cacheSet(record) {
  _tripCache.set(record.id, record);
}
function _cacheDel(id) {
  _tripCache.delete(id);
}
function _cacheSorted() {
  return [..._tripCache.values()].sort((a, b) => b.updatedAt - a.updatedAt);
}

/** Save (or overwrite) the current trip. Returns the saved record. */
async function persistTrip(name, existingId = null) {
  const id    = existingId ?? uid();
  const now   = Date.now();
  const stops = serialiseStops();
  const thumb = stops.flatMap(s => s.photos)[0] ?? null;

  // Preserve original createdAt from cache or IDB
  let createdAt = now;
  if (existingId) {
    const cached = _tripCache.get(id);
    if (cached?.createdAt) {
      createdAt = cached.createdAt;
    } else {
      const db  = await openDB();
      const old = await idbReq(db.transaction(IDB_STORE).objectStore(IDB_STORE).get(id));
      if (old?.createdAt) createdAt = old.createdAt;
    }
  }

  const record = { id, name, createdAt, updatedAt: now, stops, thumb };

  // Update cache immediately — UI sees change before any async I/O
  _cacheSet(record);

  // Persist to both stores in the background; failures are non-fatal
  Promise.all([idbPut(record), fbUpsert(record)]).catch(() => {});

  return record;
}

/** Load all trips for the current user (Firestore first, IDB fallback).
 *  Populates the in-memory cache and returns sorted results. */
async function loadAllTrips() {
  // Return from cache if already populated (avoids redundant async reads)
  if (_tripCache.size > 0) return _cacheSorted();

  let trips = await fbLoadAll();
  if (!trips) {
    // Offline or Firebase not configured — use IndexedDB
    const all = await idbGetAll();
    trips = all.sort((a, b) => b.updatedAt - a.updatedAt);
  } else {
    // Mirror Firestore results into IDB so offline works after first load
    trips.forEach(t => idbPut(t).catch(() => {}));
  }

  // Deduplicate by id — keep the record with the highest updatedAt
  const seen = new Map();
  for (const t of trips) {
    if (!seen.has(t.id) || t.updatedAt > seen.get(t.id).updatedAt) {
      seen.set(t.id, t);
    }
  }
  const sorted = [...seen.values()].sort((a, b) => b.updatedAt - a.updatedAt);

  // Seed the cache
  sorted.forEach(t => _cacheSet(t));
  return sorted;
}

/** Delete a trip everywhere. */
async function deleteTrip(id) {
  // Remove from cache immediately — UI updates before I/O completes
  _cacheDel(id);
  // Fire-and-forget persistence deletes
  Promise.all([idbDelete(id), fbDelete(id)]).catch(() => {});
}

// ─────────────────────────────────────────
// ACTIVE TRIP STATE
// ─────────────────────────────────────────
let activeTripId   = null;
let activeTripName = null;

/** Auto-save after each new stop (only if trip already named). */
async function autoSave() {
  if (!activeTripId) return;
  await persistTrip(activeTripName, activeTripId); // cache updated inside persistTrip
  _renderSidebar(_cacheSorted()); // instant — no I/O wait
}

// #endregion STORAGE LAYER

// ─────────────────────────────────────────
// TRIPS SIDEBAR
// ─────────────────────────────────────────

/**
 * A non-blocking replacement for window.confirm().
 * Appends a small dialog to document.body and resolves true/false.
 */
function inlineConfirm(message) {
  return new Promise(resolve => {
    const overlay = document.createElement('div');
    overlay.className = 'inline-confirm-overlay';
    overlay.innerHTML = `
      <div class="inline-confirm-box">
        <p>${message}</p>
        <div class="inline-confirm-btns">
          <button class="inline-confirm-cancel">Cancel</button>
          <button class="inline-confirm-ok">OK</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    const cleanup = val => { overlay.remove(); resolve(val); };
    overlay.querySelector('.inline-confirm-ok').addEventListener('click', () => cleanup(true));
    overlay.querySelector('.inline-confirm-cancel').addEventListener('click', () => cleanup(false));
    overlay.addEventListener('click', e => { if (e.target === overlay) cleanup(false); });
  });
}

/** Re-render the sidebar tiles. Uses the in-memory cache when warm (instant),
 *  otherwise does a one-time async load to seed it. */
async function refreshSidebar() {
  const trips = await loadAllTrips();
  _renderSidebar(trips);
}

function _renderSidebar(trips) {
  tripsList.innerHTML = '';
  if (trips.length === 0) {
    const empty = document.createElement('p');
    empty.className = 'trips-empty';
    empty.textContent = 'No saved trips yet.';
    tripsList.appendChild(empty);
    return;
  }
  trips.forEach(trip => {
    const tile = document.createElement('div');
    tile.className = 'trip-tile' + (trip.id === activeTripId ? ' active' : '');
    tile.dataset.id = trip.id;

    // Thumbnail
    const thumb = document.createElement('div');
    thumb.className = 'trip-thumb';
    if (trip.thumb) {
      const img = document.createElement('img');
      img.src = trip.thumb;
      img.alt = trip.name;
      thumb.appendChild(img);
    } else {
      thumb.textContent = '🗺️';
    }

    // Info
    const info = document.createElement('div');
    info.className = 'trip-info';

    const tname = document.createElement('div');
    tname.className = 'trip-name';
    tname.textContent = trip.name;

    const tmeta = document.createElement('div');
    tmeta.className = 'trip-meta';
    tmeta.textContent = `${trip.stops.length} stop${trip.stops.length !== 1 ? 's' : ''} · ${new Date(trip.updatedAt).toLocaleDateString()}`;

    info.appendChild(tname);
    info.appendChild(tmeta);

    // Delete button — removes from cache & re-renders immediately, no I/O wait
    const del = document.createElement('button');
    del.className = 'trip-delete-btn';
    del.title = 'Delete trip';
    del.textContent = '✕';
    del.addEventListener('click', e => {
      e.stopPropagation();
      e.preventDefault();
      deleteTrip(trip.id); // updates cache + fires I/O in background
      if (activeTripId === trip.id) { activeTripId = null; activeTripName = null; }
      _renderSidebar(_cacheSorted()); // instant re-render from updated cache
    });

    tile.appendChild(thumb);
    tile.appendChild(info);
    tile.appendChild(del);
    tile.addEventListener('click', e => {
      if (e.target === del || del.contains(e.target)) return;
      loadTripFromRecord(trip);
    });
    tripsList.appendChild(tile);
  });
}

/** Restore a saved trip: clear map, rebuild tripLog + fans, redraw route. */
async function loadTripFromRecord(record) {
  if (tripLog.length > 0 && activeTripId !== record.id) {
    const ok = await inlineConfirm(`Load "${record.name}"? Unsaved progress will be cleared.`);
    if (!ok) return;
  }

  // Clear existing state
  clearCurrentTrip();

  activeTripId   = record.id;
  activeTripName = record.name;

  // Rebuild tripLog + fans without animation (instant restore)
  const allCoords = [ORIGIN.slice()];

  for (const stop of record.stops) {
    const logEntry = {
      coords:       stop.coords,
      display_name: stop.display_name,
      description:  stop.description,
      zoom:         stop.zoom,
      fan:          null,
      transport:    stop.transport,
      transportDef: stop.transportDef,
      lineColor:    stop.lineColor,
    };
    tripLog.push(logEntry);
    allCoords.push(stop.coords);

    // Rebuild the fan with saved photos
    const fan = new MapPhotoFan(stop.coords, map);
    for (const dataUrl of (stop.photos ?? [])) {
      fan._addPhoto(dataUrl);
    }
    logEntry.fan  = fan;
    currentMarker = fan;
  }

  // Redraw the full route line
  routeCoords.length = 0;
  allCoords.forEach(c => routeCoords.push(c));
  if (map.getSource('route')) {
    map.getSource('route').setData({
      type: 'Feature',
      geometry: { type: 'LineString', coordinates: allCoords }
    });
    // Set last leg colour
    const lastStop = tripLog[tripLog.length - 1];
    if (lastStop && map.getLayer('route-line')) {
      map.setPaintProperty('route-line', 'line-color', lastStop.lineColor ?? DEFAULT_LINE_COLOR);
    }
  }

  // Fly to first stop
  if (tripLog.length > 0) {
    const first = tripLog[0];
    map.flyTo(makeFlyOptions(first.coords, first.zoom, 2000));
    replayBar.classList.add('visible');
  }

  // Mark tile active
  refreshSidebar();

  // Announce in chat
  appendLog('system', null, `📂 Loaded trip: ${record.name} (${tripLog.length} stop${tripLog.length !== 1 ? 's' : ''})`);
}

/** Wipe the current in-progress trip from the map + memory. */
function clearCurrentTrip() {
  // Remove all fans
  tripLog.forEach(s => s.fan?.remove());
  tripLog.length   = 0;
  routeCoords.length = 0;
  routeCoords.push(ORIGIN.slice());
  currentMarker    = null;
  currentTransport = null;

  if (map.getSource('route')) {
    map.getSource('route').setData({
      type: 'Feature',
      geometry: { type: 'LineString', coordinates: [ORIGIN] }
    });
    if (map.getLayer('route-line')) {
      map.setPaintProperty('route-line', 'line-color', DEFAULT_LINE_COLOR);
    }
  }

  replayBar.classList.remove('visible');
}

// MAP PHOTO FAN  — photos fanning out at a map marker
// ─────────────────────────────────────────
class MapPhotoFan {
  /**
   * @param {[number,number]} lngLat  — [lng, lat]
   * @param {mapboxgl.Map}    map
   */
  constructor(lngLat, map) {
    this.lngLat  = lngLat;
    this.map     = map;
    this.photos  = [];   // { dataUrl, wrap, img } objects

    // Root wrapper — a Mapbox Marker with a 0×0 custom element
    this._root = document.createElement('div');
    this._root.className = 'map-photo-fan-wrap';

    // Amber dot
    this._dot = document.createElement('div');
    this._dot.className = 'map-marker-dot';
    this._root.appendChild(this._dot);

    // "+" button
    this._addBtn = document.createElement('button');
    this._addBtn.className = 'map-add-photo-btn';
    this._addBtn.title = 'Add photos to this location';
    this._addBtn.textContent = '+';
    this._root.appendChild(this._addBtn);

    // Hidden file input
    this._fileInput = document.createElement('input');
    this._fileInput.type = 'file';
    this._fileInput.accept = 'image/*';
    this._fileInput.multiple = true;
    this._fileInput.style.display = 'none';
    document.body.appendChild(this._fileInput);

    this._addBtn.addEventListener('click', e => {
      e.stopPropagation();
      this._fileInput.click();
    });
    this._fileInput.addEventListener('change', () => this._handleFiles());

    // Mapbox marker (anchor = centre of the 0×0 element = the dot's top-left baseline)
    this._marker = new mapboxgl.Marker({ element: this._root, anchor: 'center' })
      .setLngLat(lngLat)
      .addTo(map);
  }

  _handleFiles() {
    const remaining = 5 - this.photos.length;
    const files = Array.from(this._fileInput.files).slice(0, remaining);
    files.forEach(file => {
      const reader = new FileReader();
      reader.onload = e => this._addPhoto(e.target.result);
      reader.readAsDataURL(file);
    });
    this._fileInput.value = '';
    if (this.photos.length >= 5) this._addBtn.style.display = 'none';
  }

  _addPhoto(dataUrl) {
    if (this.photos.length >= 5) return;
    const idx = this.photos.length;

    // wrapper (needed for the ✕ badge)
    const wrap = document.createElement('div');
    wrap.className = 'map-fan-img-wrap';
    wrap.style.zIndex = idx + 4;

    const img = document.createElement('img');
    img.className = 'map-fan-img';
    img.src = dataUrl;
    img.draggable = false;
    img.title = 'Click to enlarge';
    img.addEventListener('click', e => {
      e.stopPropagation();
      openLightbox(dataUrl);
    });

    const badge = document.createElement('div');
    badge.className = 'remove-badge';
    badge.textContent = '✕';
    badge.title = 'Remove photo';
    badge.addEventListener('click', e => {
      e.stopPropagation();
      const i = this.photos.findIndex(p => p.wrap === wrap);
      if (i === -1) return;
      wrap.remove();
      this.photos.splice(i, 1);
      this._relayout();
      if (this.photos.length < 5) this._addBtn.style.display = '';
    });

    wrap.appendChild(img);
    wrap.appendChild(badge);
    this._root.appendChild(wrap);

    this.photos.push({ dataUrl, wrap, img });
    this._relayout();
    if (this.photos.length >= 5) this._addBtn.style.display = 'none';
    // Persist updated photos to IndexedDB
    autoSave();
  }

  // Recompute positions/rotations for every photo in the fan
  _relayout() {
    const n = this.photos.length;
    if (n === 0) return;

    // Spread arc: widens as more photos are added (max 80° total)
    const spreadDeg = Math.min(40 * (n - 1), 80);
    const imgW = 72, imgH = 84;
    const radius = 72; // px from the dot centre to the bottom-centre of each photo

    this.photos.forEach(({ wrap }, i) => {
      // -90° = straight up; spread evenly around that axis
      const baseDeg = -90;
      const angleDeg = n === 1
        ? baseDeg
        : baseDeg - spreadDeg / 2 + (spreadDeg / (n - 1)) * i;
      const angleRad = (angleDeg * Math.PI) / 180;

      // Centre of photo bottom sits at this offset from the dot
      const bx = radius * Math.cos(angleRad);
      const by = radius * Math.sin(angleRad);

      // Card tilt mirrors the fan angle (0° = upright when pointing straight up)
      const tiltDeg = angleDeg + 90;

      // Top-left of the wrap relative to the 0×0 origin (dot centre)
      const tx = bx - imgW / 2;
      const ty = by - imgH;

      // Wrap handles position + rotation; img handles hover scale via CSS
      wrap.style.transform  = `translate(${tx}px, ${ty}px) rotate(${tiltDeg}deg)`;
      wrap.style.zIndex     = i + 4;

      // Pivot scale from the card's bottom-centre (attachment point to the fan)
      const img = wrap.querySelector('img');
      img.style.transformOrigin = `${imgW / 2}px ${imgH}px`;
      img.style.transform = ''; // clear any leftover inline transform
    });
  }

  hide()   { this._root.style.display = 'none'; }
  show()   { this._root.style.display = ''; }
  remove() {
    this._marker.remove();
    this._fileInput.remove();
  }
}

// ─────────────────────────────────────────
// LOCAL TOOL EXECUTION
// resolve_location → Mapbox Geocoding API
// fly_to_location  → Mapbox GL JS + animation
// set_transport    → updates route colour + transport state
// ─────────────────────────────────────────

// Minimal geocoder using Mapbox Geocoding API
async function resolve_location({ query }) {
  const url = `https://api.mapbox.com/geocoding/v5/mapbox.places/${encodeURIComponent(query)}.json?access_token=${MAPBOX_TOKEN}&limit=1`;
  try {
    const res = await fetch(url);
    const data = await res.json();
    if (!data.features || data.features.length === 0) {
      return { error: `Could not resolve location: "${query}"` };
    }
    const f = data.features[0];
    const [lon, lat] = f.center;
    return {
      query,
      latitude: lat,
      longitude: lon,
      display_name: f.place_name.split(',')[0].trim(),
      full_name: f.place_name,
      place_type: f.place_type?.[0] ?? 'place',
    };
  } catch (e) {
    return { error: `Geocoding failed: ${e.message}` };
  }
}

// ─────────────────────────────────────────
// ANIMATION CORE  — RAF loop: route line + emoji marker
// ─────────────────────────────────────────

/**
 * Drives BOTH the route line AND the transport emoji marker from the same
 * requestAnimationFrame clock, so the emoji and the dashed line always arrive
 * together.
 *
 * @param {string|null}       mode         - 'plane'|'train'|'car'|'custom'|null
 * @param {[number,number]}   fromCoord
 * @param {[number,number]}   toCoord
 * @param {number}            duration     - ms
 * @param {[number,number][]} baseCoords   - live route array; new point appended at t=1
 * @param {Function}          [onDone]     - called once t reaches 1
 * @param {object}            [transportDef] - frozen snapshot for replay; falls back to TRANSPORT[mode]
 * @returns {Function} cancel — stops the loop and removes the marker
 */
function animateRouteAndMarker(mode, fromCoord, toCoord, duration, baseCoords, onDone, transportDef) {
  // Resolve the transport definition once (replay snapshot takes priority)
  const tDef = transportDef ?? (mode ? TRANSPORT[mode] : null) ?? null;

  // ── bearing (degrees) from a to b, for plane rotation ───────────────────
  function calcBearing(a, b) {
    const R = Math.PI / 180;
    const dLng = (b[0] - a[0]) * R;
    const lat1 = a[1] * R, lat2 = b[1] * R;
    const y = Math.sin(dLng) * Math.cos(lat2);
    const x = Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLng);
    return (Math.atan2(y, x) / R + 360) % 360;
  }

  // ── emoji marker ─────────────────────────────────────────────────────────
  let marker = null, markerEl = null;
  // ✈️ points east naturally; subtract 90° so it faces the actual heading
  const rotationDeg = (tDef && mode === 'plane') ? calcBearing(fromCoord, toCoord) - 90 : 0;

  if (tDef) {
    markerEl = document.createElement('div');
    markerEl.className = 'transport-emoji-marker';
    markerEl.textContent = tDef.emoji;
    marker = new mapboxgl.Marker({ element: markerEl, anchor: 'center' })
      .setLngLat(fromCoord)
      .addTo(map);
  }

  // Cache the GeoJSON source once — avoids repeated map.getSource() calls per frame
  const routeSource = map.getSource('route');

  let cancelled = false;
  let startTime = null;
  let rafId     = null;

  function frame(ts) {
    if (cancelled) return;
    if (startTime === null) startTime = ts;

    const raw = Math.min((ts - startTime) / duration, 1);
    const t   = easeInOutCubic(raw);
    const lng = lerp(fromCoord[0], toCoord[0], t);
    const lat = lerp(fromCoord[1], toCoord[1], t);

    // Update route line
    if (routeSource) {
      routeSource.setData({
        type: 'Feature',
        geometry: { type: 'LineString', coordinates: [...baseCoords, [lng, lat]] }
      });
    }

    // Update emoji marker position (and bearing for plane)
    if (marker) {
      marker.setLngLat([lng, lat]);
      if (mode === 'plane') {
        markerEl.style.transform = `translate(-50%, -50%) rotate(${rotationDeg}deg)`;
      }
    }

    if (raw < 1) {
      rafId = requestAnimationFrame(frame);
      return;
    }

    // ── t === 1: commit final coord and clean up ──────────────────────────
    if (routeSource) {
      baseCoords.push(toCoord);
      routeSource.setData({
        type: 'Feature',
        geometry: { type: 'LineString', coordinates: baseCoords }
      });
    }

    // Fade out then remove emoji marker
    if (marker) {
      setTimeout(() => {
        if (cancelled) return;
        markerEl.style.transition = 'opacity 0.5s ease';
        markerEl.style.opacity = '0';
        setTimeout(() => { if (!cancelled) marker.remove(); }, 520);
      }, 350);
    }

    onDone?.();
  }

  rafId = requestAnimationFrame(frame);

  return () => {
    cancelled = true;
    if (rafId) cancelAnimationFrame(rafId);
    if (marker) marker.remove();
  };
}

// ─────────────────────────────────────────
// TOOL IMPLEMENTATIONS
// ─────────────────────────────────────────

function fly_to_location({ latitude, longitude, display_name, description, zoom }) {
  // Snapshot the transport for THIS leg before anything resets it
  const legTransport   = currentTransport;
  const transportSnap  = legTransport ? { ...TRANSPORT[legTransport] } : null;
  const effectiveZoom  = zoom ?? 10;

  // Hide the current fan (keep it alive for replay — don't remove it)
  if (currentMarker) {
    currentMarker.hide();
    currentMarker = null;
  }

  const newCoord  = [longitude, latitude];
  const fromCoord = routeCoords[routeCoords.length - 1];

  // Apply transport line colour (fallback to default brown)
  const lineColour = transportSnap?.lineColor ?? DEFAULT_LINE_COLOR;
  if (map.getLayer('route-line')) {
    map.setPaintProperty('route-line', 'line-color', lineColour);
  }

  const FLY_DURATION = DURATIONS.fly;

  // Unified RAF loop — route line and emoji share the same clock
  animateRouteAndMarker(legTransport, fromCoord, newCoord, FLY_DURATION, routeCoords);

  map.flyTo(makeFlyOptions(newCoord, effectiveZoom, FLY_DURATION));

  // Push the log entry immediately so the fan callback can reference it by index
  const logEntry = {
    coords:       newCoord,
    display_name,
    description:  description ?? '',
    zoom:         effectiveZoom,
    fan:          null,          // filled in below once the fan is created
    transport:    legTransport,
    transportDef: transportSnap,
    lineColor:    lineColour,
  };
  tripLog.push(logEntry);
  replayBar.classList.add('visible');

  // Create the MapPhotoFan after the fly animation settles (+200 ms buffer)
  // Then show a photo nudge in chat so the user knows to add pics before continuing
  setTimeout(() => {
    const fan    = new MapPhotoFan(newCoord, map);
    currentMarker = fan;
    logEntry.fan  = fan;          // safe: we hold a direct reference, no index lookup

    // Show photo nudge — dismissed automatically when the user starts typing
    showPhotoNudge(display_name);

    // Auto-save to IndexedDB if trip is already named
    autoSave();
  }, FLY_DURATION + 200);

  // Reset so the next leg requires a fresh transport choice
  currentTransport = null;

  // Overlay label
  flyLabel.textContent = display_name;
  flyLabel.classList.add('visible');
  setTimeout(() => flyLabel.classList.remove('visible'), 5000);

  return {
    success:     true,
    flew_to:     display_name,
    coordinates: { latitude, longitude },
    zoom:        effectiveZoom,
    transport:   legTransport,
  };
}

function set_transport({ mode, emoji, custom_label }) {
  // For custom mode, hydrate the TRANSPORT slot on the fly
  if (mode === 'custom') {
    if (!emoji) return { error: 'custom mode requires an emoji' };
    TRANSPORT.custom = {
      emoji:     emoji.trim(),
      label:     custom_label?.trim() || `by ${emoji.trim()}`,
      lineColor: '#6a3d9a',
    };
  }

  if (!TRANSPORT[mode]) return { error: `Unknown transport mode: ${mode}` };
  currentTransport = mode;

  const colour = TRANSPORT[mode].lineColor;
  if (map.getLayer('route-line')) {
    map.setPaintProperty('route-line', 'line-color', colour);
  }

  return { success: true, mode, label: TRANSPORT[mode].label };
}

function dispatch_tool(name, input) {
  if (name === 'resolve_location') return resolve_location(input);
  if (name === 'fly_to_location')  return Promise.resolve(fly_to_location(input));
  if (name === 'set_transport')    return Promise.resolve(set_transport(input));
  return Promise.resolve({ error: `Unknown tool: ${name}` });
}

// ─────────────────────────────────────────
// CLAUDE AGENT LOOP
// ─────────────────────────────────────────

/**
 * Single shared wrapper around the Anthropic proxy.
 * @param {number} max_tokens
 * @param {Array}  messages
 */
async function callClaude(max_tokens, messages) {
  const res = await fetch(ANTHROPIC_PROXY, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: CLAUDE_MODEL,
      max_tokens,
      system: systemPrompt,
      tools,
      messages,
    }),
  });
  const data = await res.json();
  if (data.error) throw new Error(data.error.message ?? JSON.stringify(data.error));
  return data;
}

async function runAgent(userMessage) {
  conversationHistory.push({ role: 'user', content: userMessage });

  while (true) {
    const data = await callClaude(CLAUDE_MAX_TOKENS, conversationHistory);

    conversationHistory.push({ role: 'assistant', content: data.content });

    // Partition the response into tool calls and plain text blocks in one pass
    const toolCalls = [];
    const textParts = [];
    for (const block of data.content) {
      if (block.type === 'tool_use')  toolCalls.push(block);
      else if (block.type === 'text') textParts.push(block.text);
    }

    // No tool calls → pure text reply; return it to the caller
    if (toolCalls.length === 0) return textParts.join('\n');

    // Execute all tool calls in parallel, log each one
    const results = await Promise.all(
      toolCalls.map(async tc => {
        appendLog('tool', null, `⚙ ${tc.name}(${JSON.stringify(tc.input)})`);
        let result;
        try   { result = await dispatch_tool(tc.name, tc.input); }
        catch (e) { result = { error: e.message }; }
        return { type: 'tool_result', tool_use_id: tc.id, content: JSON.stringify(result) };
      })
    );

    conversationHistory.push({ role: 'user', content: results });
  }
}

// ─────────────────────────────────────────
// WELCOME — Carte opens the conversation
// ─────────────────────────────────────────
const FALLBACK_GREETING = "Where in the world have you been? Tell me everything ✈️";

async function startConversation() {
  conversationHistory.push({
    role: 'user',
    content: '[SYSTEM] The user just opened the app. Greet them warmly and ask where their travels have taken them. One or two sentences max.'
  });

  try {
    const data     = await callClaude(CLAUDE_MAX_TOKENS_GREETING, conversationHistory);
    const greeting = data.content?.filter(b => b.type === 'text').map(b => b.text).join('')
                     || FALLBACK_GREETING;
    conversationHistory.push({ role: 'assistant', content: data.content });
    welcomeMsg.textContent = greeting;
  } catch (_) {
    welcomeMsg.textContent = FALLBACK_GREETING;
  }
}

// ─────────────────────────────────────────
// REPLAY ENGINE
// ─────────────────────────────────────────
let replayAborted = false;

// ── Replay helpers ────────────────────────

/**
 * Resolves when the user clicks the Next button.
 * Rejects with Error('aborted') if the stop button fires first.
 */
function waitForNext() {
  return new Promise((resolve, reject) => {
    function onNext()  { hudNextBtn._abortFn = null; resolve(); }
    function onAbort() { hudNextBtn._abortFn = null; reject(new Error('aborted')); }
    hudNextBtn.addEventListener('click', onNext, { once: true });
    hudNextBtn._abortFn = onAbort;
  });
}

/** Rebuild the progress dot row. Dots are emoji icons when a transport is known. */
function buildHudDots(activeIdx) {
  const total = tripLog.length;
  hudDotsEl.innerHTML = '';
  for (let i = 0; i < total; i++) {
    const stop  = tripLog[i];
    const state = i < activeIdx ? 'done' : i === activeIdx ? 'active' : '';
    const emoji = stop.transportDef?.emoji;
    const d     = document.createElement('div');
    if (emoji) {
      d.className   = `hud-dot-icon ${state}`;
      d.textContent = emoji;
    } else {
      d.className = `hud-dot ${state}`;
    }
    d.title = stop.display_name ?? '';
    hudDotsEl.appendChild(d);
  }
}

const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

/** Promise wrapper around animateRouteAndMarker. */
function animateSegment(baseCoords, fromCoord, toCoord, duration, transportMode, transportDef) {
  return new Promise(resolve => {
    animateRouteAndMarker(transportMode, fromCoord, toCoord, duration, baseCoords, resolve, transportDef);
  });
}

async function replayTrip() {
  if (tripLog.length < 2) return;
  replayAborted = false;

  // Lock UI (sendBtn / inputEl are module-level cached refs)
  replayBtn.disabled = true;
  stopBtn.classList.add('visible');
  sendBtn.disabled   = true;
  inputEl.disabled   = true;
  hudEl.classList.add('visible');
  hudNextBtn.disabled = true;

  // Wire stop button to abort any pending waitForNext
  const origStopHandler = stopBtn.onclick;
  stopBtn.onclick = () => {
    replayAborted = true;
    hudNextBtn._abortFn?.();
  };

  // Hide all fans and reset the route line to origin only
  tripLog.forEach(s => s.fan?.hide());
  currentMarker = null;

  const originCoords = [ORIGIN];
  map.getSource('route').setData({
    type: 'Feature',
    geometry: { type: 'LineString', coordinates: originCoords }
  });

  // Fly back to overview
  map.flyTo({ center: ORIGIN, zoom: 3, pitch: 20, bearing: 0, duration: DURATIONS.flyOverview });
  await sleep(DURATIONS.overviewWait);

  const FLY_DUR    = DURATIONS.flyReplay;
  let drawnCoords  = [ORIGIN.slice()];

  try {
    for (let i = 0; i < tripLog.length; i++) {
      if (replayAborted) break;

      const stop = tripLog[i];
      const from = i === 0 ? ORIGIN : tripLog[i - 1].coords;

      // Update HUD
      hudNextBtn.disabled  = true;
      hudNextBtn.textContent = 'flying…';
      buildHudDots(i);
      hudStopLabel.textContent  = `Stop ${i + 1} of ${tripLog.length}`;
      hudNameLabel.textContent  = stop.display_name;
      hudTransport.textContent  = stop.transportDef?.label ?? '';

      if (map.getLayer('route-line')) {
        map.setPaintProperty('route-line', 'line-color', stop.lineColor ?? DEFAULT_LINE_COLOR);
      }

      // Fly + animate line+emoji in parallel (shared RAF clock)
      map.flyTo(makeFlyOptions(stop.coords, stop.zoom, FLY_DUR));
      await animateSegment(drawnCoords, from, stop.coords, FLY_DUR, stop.transport, stop.transportDef);

      stop.fan?.show();

      flyLabel.textContent = stop.display_name;
      flyLabel.classList.add('visible');

      // Last stop → "Done ✓", all others → "Next →"
      hudNextBtn.textContent = (i === tripLog.length - 1) ? 'Done ✓' : 'Next →';
      hudNextBtn.disabled    = false;
      await waitForNext();
      flyLabel.classList.remove('visible');
    }
  } catch (_) {
    // aborted — fall through to cleanup
  }

  // Commit whatever was drawn
  map.getSource('route').setData({
    type: 'Feature',
    geometry: { type: 'LineString', coordinates: drawnCoords }
  });

  if (!replayAborted) {
    buildHudDots(tripLog.length); // mark all dots done
    currentMarker = tripLog[tripLog.length - 1].fan ?? null;
  }

  // Restore UI
  flyLabel.classList.remove('visible');
  hudEl.classList.remove('visible');
  stopBtn.classList.remove('visible');
  stopBtn.onclick     = origStopHandler;
  hudNextBtn.disabled = true;
  replayBtn.disabled  = false;
  sendBtn.disabled    = false;
  inputEl.disabled    = false;
}

// ─────────────────────────────────────────
// UI HELPERS
// ─────────────────────────────────────────

function appendLog(role, label, content) {
  const div = document.createElement('div');
  div.className = `msg ${role}`;

  if (label) {
    const l = document.createElement('div');
    l.className = 'msg-label';
    l.textContent = label;
    div.appendChild(l);
  }

  const bubble = document.createElement('div');
  bubble.className  = 'msg-bubble';
  bubble.textContent = content;
  div.appendChild(bubble);

  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  return div;
}

/**
 * Shows a dismissable photo nudge in the chat log after landing at a new stop.
 * Disappears automatically when the user focuses the input or starts typing.
 */
let _photoNudgeEl = null;
function showPhotoNudge(placeName) {
  // Remove any previous nudge
  _photoNudgeEl?.remove();

  const div = document.createElement('div');
  div.className = 'msg photo-nudge';

  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  bubble.innerHTML = `📷 Tap <strong>+</strong> on the map pin to add photos of ${placeName}. Then tell me where you went next!`;
  div.appendChild(bubble);

  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  _photoNudgeEl = div;

  // Dismiss when user focuses the input field
  function dismiss() {
    div.style.transition = 'opacity 0.4s ease';
    div.style.opacity = '0';
    setTimeout(() => div.remove(), 420);
    inputEl.removeEventListener('focus', dismiss);
    inputEl.removeEventListener('input', dismiss);
  }
  inputEl.addEventListener('focus', dismiss, { once: true });
  inputEl.addEventListener('input', dismiss, { once: true });
}

// ─────────────────────────────────────────
// EVENT HANDLING
// ─────────────────────────────────────────

// ── LIGHTBOX ─────────────────────────────
lightboxCloseBtn.addEventListener('click', closeLightbox);
lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

// ── CHAT ─────────────────────────────────

async function handleSend() {
  const query = inputEl.value.trim();
  if (!query) return;

  inputEl.value = '';
  sendBtn.disabled = true;

  appendLog('user', 'You', query);

  const thinkingEl = appendLog('assistant', 'Carte', '');
  thinkingEl.querySelector('.msg-bubble').innerHTML = '<span class="spinner"></span>';

  try {
    const reply = await runAgent(query);
    const bubble = thinkingEl.querySelector('.msg-bubble');
    bubble.innerHTML = '';
    bubble.textContent = reply;
  } catch (err) {
    thinkingEl.querySelector('.msg-bubble').textContent = `Error: ${err.message}`;
  }

  sendBtn.disabled = false;
  inputEl.focus();
}

sendBtn.addEventListener('click', handleSend);
inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') handleSend(); });

// ── REPLAY ───────────────────────────────
replayBtn.addEventListener('click', replayTrip);
stopBtn.addEventListener('click', () => { replayAborted = true; });

// ─────────────────────────────────────────
// BOOT
// ─────────────────────────────────────────

// Register service worker (PWA offline shell) — skip on localhost so the SW
// never caches stale assets during development.
if ('serviceWorker' in navigator && location.hostname !== 'localhost') {
  navigator.serviceWorker.register('/sw.js')
    .then(reg => reg.update())
    .catch(() => {});
} else if (location.hostname === 'localhost') {
  // Unregister any previously installed SW so it stops intercepting requests
  navigator.serviceWorker.getRegistrations()
    .then(regs => regs.forEach(r => r.unregister()));
}

startConversation();

// On boot: purge any IDB records that are stale/corrupt (no updatedAt or
// mismatched user) so they don't pollute the sidebar via the IDB fallback.
(async () => {
  try {
    const all = await idbGetAll();
    for (const t of all) {
      if (!t.updatedAt || !t.id || !Array.isArray(t.stops)) {
        await idbDelete(t.id);
      }
    }
  } catch (_) {}
})();

refreshSidebar();
</script>
